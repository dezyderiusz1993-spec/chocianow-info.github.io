<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Wyszukiwarka śledcza</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="container">
    <h1 class="logo">Wyszukiwarka śledcza</h1>

    <form id="search-form" class="search-form">
      <input
        id="query"
        type="text"
        placeholder="Wpisz zapytanie do śledztwa..."
        autocomplete="off"
        required
      />
      <button type="submit">Szukaj</button>
    </form>

    <div id="status" class="status" hidden></div>

    <section id="report-section" hidden>
      <h2>Raport AI</h2>
      <div id="report" class="report"></div>
    </section>

    <section id="sources-section" hidden>
      <h2>Źródła</h2>
      <ol id="sources" class="sources"></ol>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
